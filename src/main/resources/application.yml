spring:
  application:
    name: ai-assist

server:
  # The port is chosen by the launcher (AiAssistApplication): a dedicated
  # 1234 by default (not the widely-contended 8080), falling back to a free
  # OS-assigned port if 1234 is already taken — so ai-assist never blocks
  # another app. Override the preference with -Dai-assist.port=N.
  #
  # Deliberately NOT set here: the launcher supplies server.port at startup.
  # A value in this file would override the launcher's free-port fallback and
  # make the app crash (instead of stepping aside) when 1234 is already taken.
  #
  # Bind the local REST API to the loopback interface only, so it is never
  # reachable from other machines on the network (office LAN, shared Wi-Fi).
  # Everything the app needs runs on this one machine.
  address: 127.0.0.1
  # Never leak stack traces, exception messages, or binding details to callers.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  # Do not advertise the server implementation/version in responses.
  server-header: ""
  # Bound request sizes to blunt trivial memory-exhaustion attempts.
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 512KB
    max-swallow-size: 512KB

ai-assist:
  output:
    # When Stop is pressed, the complete notes are saved as a 12-hour
    # timestamped rich-text (.rtf) file (Minutes-<timestamp>.rtf). Leave dir
    # blank to save into a "minutes-of-meeting" folder in the user's
    # Documents; set an absolute path to save somewhere else (e.g.
    # ${user.home}/Desktop).
    save-drafts: true
    dir: ""
  auto:
    # Listening begins when the user presses Start (set true to begin
    # capturing immediately at launch). Interim notes keep re-drafting in
    # memory. The desktop window opens automatically.
    start-capture: false
    draft-interval-seconds: 30
    content-type: MEETING_NOTES
    tone: PROFESSIONAL
  transcription:
    # English speech model (proven, lightweight vosk-small-en-us). To keep the
    # download small, NO model is bundled in the app — the user places the model
    # themselves (see the Settings tab -> Instructions in the app). Drop the
    # model .zip into the models folder and the app unpacks it automatically.
    model-dir: ${java.io.tmpdir}/ai-assist/models
    model-name: vosk-model-small-en-us-0.15
    # Keep false so the app never uses the internet at runtime.
    allow-download: false
    sample-rate: 16000
    # Optional override for the meeting-audio source. Leave empty to
    # auto-detect: microphone + any OS loopback device (e.g. "Stereo Mix").
    preferred-device: ""
  ollama:
    # Set to true to draft with a local open-source LLM served by Ollama
    # (https://ollama.com). When false, the built-in template drafter is used.
    enabled: false
    base-url: http://localhost:11434
    model: llama3.2
    timeout-seconds: 120
  # Feedback email delivery, via Gmail's SMTP relay (authenticated) rather
  # than direct-to-server delivery: sending unauthenticated straight to a
  # recipient's mail server almost never actually arrives — most home/office
  # networks block outbound port 25 outright, and even when the connection
  # succeeds, Gmail's spam filtering typically accepts the message (SMTP
  # "250 OK") and then silently drops or spam-folders it, since the sending
  # machine has no reverse-DNS and the from-address has no SPF/DKIM behind
  # it — a failure the app has no way to detect or report.
  #
  # To actually receive feedback, fill in username/password below with a
  # Gmail account and an App Password (myaccount.google.com/apppasswords —
  # requires 2-Step Verification to be on; a regular Gmail password will not
  # work here). Also set "from" to that SAME Gmail address: Gmail requires
  # (or otherwise rewrites) the From header to match the authenticated
  # account. Never commit real credentials — supply username/password at
  # runtime (JVM -D properties or an external, git-ignored application.yml).
  # See README "Configuration". Clearing relay-host reverts to the old
  # (unreliable) direct-delivery behavior.
  feedback:
    from: noreply@ai-assist.com
    to: marutisridhar.job@gmail.com
    relay-host: smtp.gmail.com
    relay-port: 587
    username: ""
    password: ""
    start-tls: true
  # Local REST API authentication. A bearer token is generated on first run and
  # stored in .ai-assist/api-token next to the jar (owner-only). Present it as
  # "Authorization: Bearer <token>" or "X-API-Token: <token>".
  security:
    api-token: ""           # blank = auto-generate and persist; set to pin a fixed value
    api-token-required: true # require a valid token on every API call
    token-file: ""          # blank = .ai-assist/api-token next to the jar
