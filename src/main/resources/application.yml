spring:
  application:
    name: ai-assist

server:
  port: 8080

ai-assist:
  output:
    # When a meeting is ended, its complete notes are saved as a timestamped
    # Markdown file, e.g. drafts/2026-07-05_14-30-05_weekly-status-meeting.md.
    # Nothing is written to disk until the meeting is explicitly ended.
    save-drafts: true
    dir: drafts
  auto:
    # Double-click-and-go: start capturing (microphone + any OS loopback
    # device) as soon as the app launches, and keep re-drafting interim
    # notes in memory. The desktop window opens automatically.
    start-capture: true
    draft-interval-seconds: 30
    content-type: MEETING_NOTES
    tone: PROFESSIONAL
  transcription:
    # English speech model (proven, lightweight vosk-small-en-us). It is
    # embedded inside the jar when built with `mvn package -Pfetch-model`
    # and extracted to model-dir on first run — no internet at runtime.
    model-dir: ${user.home}/.ai-assist/models
    model-name: vosk-model-small-en-us-0.15
    # Keep false so the app never uses the internet at runtime.
    allow-download: false
    sample-rate: 16000
    # Optional override for the meeting-audio source. Leave empty to
    # auto-detect: microphone + any OS loopback device (e.g. "Stereo Mix").
    preferred-device: ""
  ollama:
    # Set to true to draft with a local open-source LLM served by Ollama
    # (https://ollama.com). When false, the built-in template drafter is used.
    enabled: false
    base-url: http://localhost:11434
    model: llama3.2
    timeout-seconds: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info
